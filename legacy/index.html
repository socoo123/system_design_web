<!doctype html>
<html lang="zh-CN" data-theme="parchment">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>系统设计面试 · 由浅入深</title>
    <script>
      try {
        var t = localStorage.getItem("sd-theme");
        document.documentElement.setAttribute(
          "data-theme",
          t === "dracula" ? "dracula" : "parchment",
        );
        var l = localStorage.getItem("sd-locale");
        if (l === "en" || l === "both" || l === "zh") {
          document.documentElement.setAttribute("data-locale", l);
          document.documentElement.lang = l === "en" ? "en" : "zh-CN";
        }
      } catch (e) {
        document.documentElement.setAttribute("data-theme", "parchment");
      }
    </script>
  </head>
  <body class="bg-bg-base">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
